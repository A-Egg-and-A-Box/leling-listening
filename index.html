<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>音乐作品助手 · 引导式音乐鉴赏（改进版）</title>
<link rel="stylesheet" href="shared/base.css">
<style>
/* 通用版：与乐龄版共用同一套暖色人文设计语言，只是字号更紧凑 */
.app { max-width: 820px; }
.bg-orb { position: fixed; border-radius: 50%; filter: blur(90px); pointer-events: none; z-index: 0; }
.orb1 { width: 420px; height: 420px; background: rgba(194, 112, 61, .10); top: -120px; left: -120px; }
.orb2 { width: 340px; height: 340px; background: rgba(126, 155, 135, .12); bottom: -80px; right: -80px; }
.app { position: relative; z-index: 1; }
</style>
</head>
<body>

<div class="bg-orb orb1"></div>
<div class="bg-orb orb2"></div>

<div class="app">
  <header class="topbar">
    <div class="brand"><span class="logo">🎵</span>音乐作品助手<small>引导式音乐鉴赏</small></div>
    <div class="spacer"></div>
    <button class="icon-btn toggle-btn" id="aiBtn" title="可选：填上自己的大模型密钥">🤖 AI：关</button>
    <button class="icon-btn" id="recBtn">📜 我的聆听<span id="recCount" class="hidden"></span></button>
  </header>

  <section class="home" id="home">
    <div class="hero">
      <h1>音乐作品助手</h1>
      <p>选一首曲子，从易到难，跟着它慢慢听、慢慢说。</p>
      <div class="quote">我不会直接告诉你答案——因为最好的答案，是你自己听出来的。</div>
      <div class="note-line">曲库内置 18 首 · 点开即在页面里播放 B 站录音 · AI 引导可自备密钥（可选）</div>
    </div>
    <div class="filter" id="filter"></div>
    <div style="margin-bottom:22px">
      <input class="search-box" id="search" placeholder="搜索曲名、作曲家或时期…">
    </div>
    <div class="track-grid" id="grid"></div>
  </section>

  <section class="chat-view hidden" id="chatView">
    <div class="subbar">
      <button class="back" onclick="MZApp.goHome()" aria-label="返回">←</button>
      <div class="at" id="subTitle"></div>
    </div>
    <div class="player-dock" id="playerDock"></div>
    <div class="stage-bar" id="stageBar"></div>
    <div class="chat" id="chat"></div>
    <div class="composer" id="composer"></div>
  </section>
</div>

<div class="sheet-mask" id="recordsSheet">
  <div class="sheet">
    <h3>我的聆听</h3>
    <div id="recordsBody"></div>
    <div style="margin-top:16px;text-align:right">
      <button class="icon-btn" onclick="MZApp.hideRecords()">关闭</button>
    </div>
  </div>
</div>

<script src="shared/catalog.js"></script>
<script src="shared/player.js"></script>
<script src="shared/llm.js"></script>
<script src="shared/engine.js"></script>
<script src="shared/app.js"></script>
<script>MZApp.init({ senior: false });</script>
</body>
</html>
